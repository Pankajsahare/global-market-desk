name: Probe macro (temporary)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python - <<'PY'
          import re, sys
          sys.path.insert(0, "scripts")
          import build_macro as bm
          page = bm.http_get(bm.RBI_WSS, {"SelectedDate": "11/06/2026"})
          text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", page))
          for m in re.finditer(r"(?i)yield|10-year|10 year|G-Sec|Government Securit", text):
              print("..", text[max(0, m.start() - 150):m.start() + 350])
          PY
